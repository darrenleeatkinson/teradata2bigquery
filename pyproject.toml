[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "td2bq"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25",
    "google-cloud-bigquery>=3.11",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "rich>=13",
]

[project.scripts]
td2bq = "td2bq.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
gemini = [
    "google-genai>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
